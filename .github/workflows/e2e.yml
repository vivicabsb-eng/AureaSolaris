name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        id: install
        run: npm ci

      - name: Run web workspace quality checks
        id: web-quality
        run: npm run check:web

      - name: Agent handoff summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Frontend Quality"
            echo
            echo "| Gate | Outcome |"
            echo "|---|---|"
            echo "| npm ci | ${{ steps.install.outcome }} |"
            echo "| web workspace quality | ${{ steps.web-quality.outcome }} |"
            echo
            echo "### Reproduce locally"
            echo '```bash'
            echo 'npm ci'
            echo 'npm run check:web'
            echo '```'
            echo
            if [ "${{ steps.web-quality.outcome }}" = "failure" ]; then
              echo "**Start with:** the first failing lint, test, or build command reported by `npm run check:web` above."
            elif [ "${{ steps.install.outcome }}" = "failure" ]; then
              echo "**Start with:** dependency installation/package-lock consistency."
            else
              echo "Frontend source checks passed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  python-quality:
    name: Python Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Install Python dependencies
        id: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-api.txt

      - name: Configure disposable Python data
        id: data
        shell: bash
        run: |
          data_dir="$RUNNER_TEMP/aurea-python-quality/data"
          mkdir -p "$data_dir"
          echo "AUREA_DATA_DIR=$data_dir" >> "$GITHUB_ENV"
          echo "Using disposable AUREA_DATA_DIR=$data_dir"

      - name: Verify Python test classification
        id: classification
        run: |
          python - <<'PY'
          from pathlib import Path

          classification = Path('.github/python-test-classification.txt')
          allowed = {'python-quality', 'integration', 'platform-release', 'legacy-pytest'}
          entries: dict[str, str] = {}
          errors: list[str] = []

          for line_number, raw in enumerate(classification.read_text(encoding='utf-8').splitlines(), 1):
              line = raw.strip()
              if not line or line.startswith('#'):
                  continue
              parts = line.split(maxsplit=1)
              if len(parts) != 2:
                  errors.append(f'line {line_number}: expected <category> <path>')
                  continue
              category, path = parts
              if category not in allowed:
                  errors.append(f'line {line_number}: unknown category {category!r}')
              if path in entries:
                  errors.append(f'line {line_number}: duplicate classification for {path}')
              entries[path] = category

          actual = {path.as_posix() for path in Path('tests').rglob('test_*.py')}
          classified = set(entries)
          for path in sorted(actual - classified):
              errors.append(f'unclassified Python test: {path}')
          for path in sorted(classified - actual):
              errors.append(f'classification references missing test: {path}')

          if errors:
              for error in errors:
                  print(f'::error::{error}')
              raise SystemExit(1)

          print(f'Python test classification complete: {len(actual)} modules, no gaps.')
          PY

      - name: Run classified Python quality suite
        id: tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          modules: list[str] = []
          for raw in Path('.github/python-test-classification.txt').read_text(encoding='utf-8').splitlines():
              line = raw.strip()
              if not line or line.startswith('#'):
                  continue
              category, path = line.split(maxsplit=1)
              if category == 'python-quality':
                  modules.append(path.removesuffix('.py').replace('/', '.'))

          if not modules:
              raise SystemExit('No python-quality tests are classified.')

          print('Running:', sys.executable, '-m unittest', *modules, '-v')
          raise SystemExit(subprocess.run([sys.executable, '-m', 'unittest', *modules, '-v']).returncode)
          PY

      - name: Run approved astrology reference certification
        id: astrology-reference
        run: python tests/engine_reference/run_reference_checks.py --require-approved

      - name: Agent handoff summary
        if: always()
        shell: bash
        run: |
          MODULES="$(python - <<'PY'
          from pathlib import Path
          modules = []
          for raw in Path('.github/python-test-classification.txt').read_text(encoding='utf-8').splitlines():
              line = raw.strip()
              if not line or line.startswith('#'):
                  continue
              category, path = line.split(maxsplit=1)
              if category == 'python-quality':
                  modules.append(path.removesuffix('.py').replace('/', '.'))
          print(' '.join(modules))
          PY
          )"
          {
            echo "## Python Quality"
            echo
            echo "| Gate | Outcome |"
            echo "|---|---|"
            echo "| dependency install | ${{ steps.install.outcome }} |"
            echo "| disposable data setup | ${{ steps.data.outcome }} |"
            echo "| test classification | ${{ steps.classification.outcome }} |"
            echo "| classified unittest suite | ${{ steps.tests.outcome }} |"
            echo "| approved astrology reference certification | ${{ steps.astrology-reference.outcome }} |"
            echo
            echo "### Reproduce locally (POSIX shell)"
            echo '```bash'
            echo 'python -m pip install -r requirements-api.txt'
            echo 'export AUREA_DATA_DIR="$(mktemp -d)/data"'
            echo "python -m unittest $MODULES -v"
            echo 'python tests/engine_reference/run_reference_checks.py --require-approved'
            echo '```'
            echo
            if [ "${{ steps.data.outcome }}" = "failure" ]; then
              echo "**Start with:** CI runner temporary-data setup. Do not fall back to a real Aurea data directory."
            elif [ "${{ steps.classification.outcome }}" = "failure" ]; then
              echo "**Start with:** \`.github/python-test-classification.txt\`. Every \`tests/test_*.py\` file must be classified exactly once."
            elif [ "${{ steps.tests.outcome }}" = "failure" ]; then
              echo "**Start with:** the first failing Python test above. Its module identifies the affected API/runtime/storage subsystem."
            elif [ "${{ steps.astrology-reference.outcome }}" = "failure" ]; then
              echo "**Start with:** an approved external-reference fixture with real provenance; pending/rejected fixtures cannot certify the engine."
            elif [ "${{ steps.install.outcome }}" = "failure" ]; then
              echo "**Start with:** Python dependency installation/\`requirements-api.txt\`."
            else
              echo "Python quality and approved astrology reference certification passed using disposable CI data."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  packaged-sidecar:
    name: Windows Packaged Sidecar
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Install Node dependencies
        id: node-install
        run: npm ci

      - name: Install sidecar dependencies
        id: python-install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-api.txt

      - name: Run Windows source-runtime ephemeris regression
        id: source-runtime
        run: python -m unittest tests.test_sidecar_packaging_layout -v

      - name: Build frontend
        id: build
        run: npm run build:web

      - name: Build packaged sidecar
        id: package
        run: python -m PyInstaller --clean --noconfirm build_sidecar.spec

      - name: Run existing packaged-sidecar smoke
        id: smoke
        shell: powershell
        run: |
          ./tests/browser_runtime_packaged_smoke.ps1 -RuntimePath ./dist/astro-engine-x86_64-pc-windows-msvc.exe

      - name: Agent handoff summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Windows Packaged Sidecar"
            echo
            echo "| Gate | Outcome |"
            echo "|---|---|"
            echo "| Node dependencies | ${{ steps.node-install.outcome }} |"
            echo "| sidecar dependencies | ${{ steps.python-install.outcome }} |"
            echo "| source-runtime ephemeris regression | ${{ steps.source-runtime.outcome }} |"
            echo "| frontend build | ${{ steps.build.outcome }} |"
            echo "| PyInstaller sidecar | ${{ steps.package.outcome }} |"
            echo "| packaged-sidecar smoke | ${{ steps.smoke.outcome }} |"
            echo
            echo "### Reproduce on Windows"
            echo '```powershell'
            echo 'npm ci'
            echo 'python -m pip install -r requirements-api.txt'
            echo 'python -m unittest tests.test_sidecar_packaging_layout -v'
            echo 'npm run build:web'
            echo 'python -m PyInstaller --clean --noconfirm build_sidecar.spec'
            echo './tests/browser_runtime_packaged_smoke.ps1 -RuntimePath ./dist/astro-engine-x86_64-pc-windows-msvc.exe'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: E2E
    needs: [frontend-quality, python-quality, packaged-sidecar]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Install Node dependencies
        id: node-install
        run: npm ci

      - name: Install Python dependencies
        id: python-install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-api.txt

      - name: Build frontend
        id: build
        run: npm run build:web

      - name: Compiled runtime smoke
        id: runtime-smoke
        run: python -m unittest tests.test_compiled_runtime_smoke -v

      - name: Install Playwright Chromium
        id: chromium
        run: npx playwright install --with-deps chromium

      - name: Run isolated browser E2E
        id: browser-e2e
        run: python tools/run_e2e.py --skip-build

      - name: Upload Playwright artifacts
        id: artifacts
        if: failure() && steps.browser-e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            apps/web/playwright-report/
            apps/web/test-results/
            apps/web/e2e/playwright-report/
            apps/web/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Agent handoff summary
        if: always()
        shell: bash
        run: |
          {
            echo "## E2E"
            echo
            echo "This is the authoritative isolated local-runtime browser gate. It never uses the owner's real Aurea data."
            echo
            echo "| Gate | Outcome |"
            echo "|---|---|"
            echo "| Node dependencies | ${{ steps.node-install.outcome }} |"
            echo "| Python dependencies | ${{ steps.python-install.outcome }} |"
            echo "| frontend build | ${{ steps.build.outcome }} |"
            echo "| compiled runtime smoke | ${{ steps.runtime-smoke.outcome }} |"
            echo "| Chromium install | ${{ steps.chromium.outcome }} |"
            echo "| isolated Playwright E2E | ${{ steps.browser-e2e.outcome }} |"
            echo "| diagnostic artifact upload | ${{ steps.artifacts.outcome }} |"
            echo
            echo "### Reproduce locally"
            echo '```bash'
            echo 'npm ci'
            echo 'python -m pip install -r requirements-api.txt'
            echo 'npm run build:web'
            echo 'python -m unittest tests.test_compiled_runtime_smoke -v'
            echo 'npx playwright install chromium'
            echo 'python tools/run_e2e.py --skip-build'
            echo '```'
            echo
            if [ "${{ steps.build.outcome }}" = "failure" ]; then
              echo "**Start with:** the production frontend build. Chromium was not installed because the build failed first."
            elif [ "${{ steps.runtime-smoke.outcome }}" = "failure" ]; then
              echo "**Start with:** compiled frontend + Python API/runtime integration. Chromium was not installed because preflight failed."
            elif [ "${{ steps.chromium.outcome }}" = "failure" ]; then
              echo "**Start with:** Playwright/runner infrastructure; source quality and compiled runtime already passed."
            elif [ "${{ steps.browser-e2e.outcome }}" = "failure" ]; then
              echo "**Start with:** browser/runtime integration. Download \`playwright-artifacts-${{ github.run_id }}-${{ github.run_attempt }}\` for report, trace, and screenshots when available."
            elif [ "${{ steps.node-install.outcome }}" = "failure" ] || [ "${{ steps.python-install.outcome }}" = "failure" ]; then
              echo "**Start with:** dependency installation before debugging product behavior."
            else
              echo "Authoritative isolated browser E2E passed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
