name: Web API Quality

on:
  pull_request:
    paths:
      - "services/api/**"
      - ".env.example"
      - ".gitignore"
      - ".github/workflows/web-api-quality.yml"
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - ".env.example"
      - ".gitignore"
      - ".github/workflows/web-api-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-api-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-api-quality:
    name: Web API Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml

      - name: Install Web API dependencies
        id: install
        run: python -m pip install -e "./services/api[dev]"

      - name: Targeted health, error, auth, and profile route tests
        id: targeted-tests
        run: >-
          python -m pytest
          services/api/tests/test_health.py
          services/api/tests/test_errors.py
          services/api/tests/test_auth.py
          services/api/tests/test_profile_routes.py
          -q

      - name: Full Web API tests
        id: tests
        run: python -m pytest services/api/tests -q

      - name: Ruff
        id: ruff
        run: python -m ruff check services/api

      - name: Mypy with service configuration
        id: mypy
        run: python -m mypy --config-file services/api/pyproject.toml services/api/src

      - name: Agent handoff summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Web API Quality"
            echo
            echo "| Gate | Outcome |"
            echo "|---|---|"
            echo "| dependency install | ${{ steps.install.outcome }} |"
            echo "| targeted health/error/auth/profile-route pytest | ${{ steps.targeted-tests.outcome }} |"
            echo "| full API pytest | ${{ steps.tests.outcome }} |"
            echo "| Ruff | ${{ steps.ruff.outcome }} |"
            echo "| mypy (services/api config) | ${{ steps.mypy.outcome }} |"
            echo
            echo "### Reproduce from repository root"
            echo '```bash'
            echo 'python -m pip install -e "./services/api[dev]"'
            echo 'python -m pytest services/api/tests/test_health.py services/api/tests/test_errors.py services/api/tests/test_auth.py services/api/tests/test_profile_routes.py -q'
            echo 'python -m pytest services/api/tests -q'
            echo 'python -m ruff check services/api'
            echo 'python -m mypy --config-file services/api/pyproject.toml services/api/src'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
