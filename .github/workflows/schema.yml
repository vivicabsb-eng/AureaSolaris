name: Supabase Schema

on:
  pull_request:
    paths:
      - "supabase/**"
      - "services/api/pyproject.toml"
      - "services/api/src/aurea_api/infrastructure/db/**"
      - "services/api/src/aurea_api/domain/users/**"
      - "services/api/tests/infrastructure/**"
      - ".github/workflows/schema.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "services/api/pyproject.toml"
      - "services/api/src/aurea_api/infrastructure/db/**"
      - "services/api/src/aurea_api/domain/users/**"
      - "services/api/tests/infrastructure/**"
      - ".github/workflows/schema.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-schema-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    name: Supabase Schema
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository without persisted credentials
        id: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Supabase CLI
        id: cli
        uses: supabase/setup-cli@v3
        with:
          version: 2.114.0

      - name: Start local Supabase
        id: start
        run: supabase start

      - name: Reset clean database
        id: reset
        run: supabase db reset

      - name: Run pgTAP schema and RLS tests
        id: tests
        run: supabase test db

      - name: Set up Python 3.12
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml

      - name: Install Web API dependencies
        id: api-install
        run: python -m pip install -e "./services/api[dev]"

      - name: Run disposable Postgres repository contract tests
        id: repository-tests
        env:
          AUREA_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: python -m pytest services/api/tests/infrastructure/test_repositories.py -q

      - name: Agent handoff summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Supabase Schema"
            echo
            echo "This workflow uses only the disposable local Supabase stack on the GitHub runner. It does not link to or authenticate with a hosted project."
            echo
            echo "| Gate | Outcome |"
            echo "|---|---|"
            echo "| credential-free checkout | ${{ steps.checkout.outcome }} |"
            echo "| Supabase CLI setup | ${{ steps.cli.outcome }} |"
            echo "| local Supabase start | ${{ steps.start.outcome }} |"
            echo "| clean database reset | ${{ steps.reset.outcome }} |"
            echo "| pgTAP schema/RLS tests | ${{ steps.tests.outcome }} |"
            echo "| Python 3.12 setup | ${{ steps.python.outcome }} |"
            echo "| Web API dependency install | ${{ steps.api-install.outcome }} |"
            echo "| repository contract tests | ${{ steps.repository-tests.outcome }} |"
            echo
            echo "### Reproduce from repository root"
            echo '```bash'
            echo 'supabase start'
            echo 'supabase db reset'
            echo 'supabase test db'
            echo 'python -m pip install -e "./services/api[dev]"'
            echo 'AUREA_TEST_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres python -m pytest services/api/tests/infrastructure/test_repositories.py -q'
            echo '```'
            echo
            if [ "${{ steps.checkout.outcome }}" = "failure" ]; then
              echo "**Start with:** repository checkout before debugging Supabase or schema code."
            elif [ "${{ steps.cli.outcome }}" = "failure" ]; then
              echo "**Start with:** pinned Supabase CLI setup before debugging migrations or tests."
            elif [ "${{ steps.start.outcome }}" = "failure" ]; then
              echo "**Start with:** local Supabase/Docker startup before changing migrations or tests."
            elif [ "${{ steps.reset.outcome }}" = "failure" ]; then
              echo "**Start with:** the first migration error from the clean database reset."
            elif [ "${{ steps.tests.outcome }}" = "failure" ]; then
              echo "**Start with:** the first failing pgTAP assertion above."
            elif [ "${{ steps.python.outcome }}" = "failure" ]; then
              echo "**Start with:** Python setup before changing repository code."
            elif [ "${{ steps.api-install.outcome }}" = "failure" ]; then
              echo "**Start with:** Web API dependency installation before debugging repository tests."
            elif [ "${{ steps.repository-tests.outcome }}" = "failure" ]; then
              echo "**Start with:** the first failing repository contract assertion above."
            elif [ "${{ steps.repository-tests.outcome }}" = "success" ]; then
              echo "Clean-database migrations, pgTAP schema/RLS checks, and repository contracts passed."
            else
              echo "Schema validation did not complete. Inspect the first skipped or cancelled gate above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
