name: FDM-704 Supabase Validation

on:
  push:
    branches:
      - fernandoyarrum/fdm-704-p15-prove-supabase-row-isolation-with-two-identities

permissions:
  contents: read

jobs:
  supabase-isolation-gates:
    name: Supabase isolation gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Reset from migrations
        run: supabase db reset

      - name: Run pgTAP database tests
        run: supabase test db

      - name: Stop local Supabase
        if: always()
        run: supabase stop
