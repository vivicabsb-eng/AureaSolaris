name: FDM-733 Vercel OIDC Probe

on:
  push:
    branches:
      - fernandoyarrum/fdm-733-p47-re-verify-current-main-promote-the-exact-sha-and-prove

permissions:
  contents: read
  id-token: write

concurrency:
  group: fdm-733-vercel-oidc-probe
  cancel-in-progress: true

jobs:
  protected-preview:
    name: Protected preview trusted-source probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Verify exact protected previews through GitHub OIDC
        shell: bash
        env:
          VERCEL_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          WEB_URL: https://aurea-solaris-etq6gayoc-fernando-damasos-projects.vercel.app
          API_URL: https://aurea-solaris-p617tlb5l-fernando-damasos-projects.vercel.app
        run: |
          set -euo pipefail
          headers=(-H "x-vercel-trusted-oidc-idp-token: ${VERCEL_OIDC_TOKEN}")

          web_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "${headers[@]}" "$WEB_URL/")"
          api_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "${headers[@]}" "$API_URL/health")"

          echo "web_status=$web_status"
          echo "api_health_status=$api_status"
          [[ "$web_status" == 200 ]]
          [[ "$api_status" == 200 ]]
