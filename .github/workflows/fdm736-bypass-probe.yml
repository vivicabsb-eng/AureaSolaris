name: FDM-736 Protected Preview Probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'fdm-736/hosted-e2e-runner-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify exact protected previews with automation bypass
        env:
          WEB_BYPASS: ${{ secrets.AUREA_VERCEL_WEB_PROTECTION_BYPASS }}
          API_BYPASS: ${{ secrets.AUREA_VERCEL_API_PROTECTION_BYPASS }}
          WEB_URL: https://aurea-solaris-f0whqpl0m-fernando-damasos-projects.vercel.app/
          API_HEALTH_URL: https://aurea-solaris-4lxgl66k1-fernando-damasos-projects.vercel.app/health
        shell: bash
        run: |
          if [ -z "$WEB_BYPASS" ]; then
            echo "::error::AUREA_VERCEL_WEB_PROTECTION_BYPASS is missing from GitHub Actions secrets."
            exit 1
          fi
          if [ -z "$API_BYPASS" ]; then
            echo "::error::AUREA_VERCEL_API_PROTECTION_BYPASS is missing from GitHub Actions secrets."
            exit 1
          fi
          echo "FDM736_WEB_BYPASS_PRESENT=true"
          echo "FDM736_API_BYPASS_PRESENT=true"
          web_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -H "x-vercel-protection-bypass: $WEB_BYPASS" "$WEB_URL")
          api_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -H "x-vercel-protection-bypass: $API_BYPASS" "$API_HEALTH_URL")
          echo "FDM736_AUTOMATION_BYPASS_WEB_STATUS=$web_status"
          echo "FDM736_AUTOMATION_BYPASS_API_STATUS=$api_status"
          if [ "$web_status" != 200 ] || [ "$api_status" != 200 ]; then
            echo "::error::Vercel automation bypass did not unlock both exact previews."
            exit 1
          fi
