name: FDM-736 Protected Preview Audit

on:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    if: github.head_ref == 'fdm-736/hosted-e2e-runner-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WEB_BYPASS: ${{ secrets.AUREA_VERCEL_WEB_PROTECTION_BYPASS }}
      API_BYPASS: ${{ secrets.AUREA_VERCEL_API_PROTECTION_BYPASS }}
      WEB_URL: https://aurea-solaris-git-preview-fernando-damasos-projects.vercel.app
      API_URL: https://aurea-solaris-api-git-preview-fernando-damasos-projects.vercel.app
      HELPER_URL: https://rosklqnnbmhowohoyboj.supabase.co/functions/v1/fdm-736-audit-helper
      AUREA_PRODUCTION_API_URL: https://aurea-solaris-api.vercel.app
      AUREA_PRODUCTION_SUPABASE_URL: https://tgpcpxqqusehssaihvcp.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify bypass and issue disposable users
        shell: bash
        run: |
          test -n "$WEB_BYPASS"
          test -n "$API_BYPASS"
          web_status=$(curl -sS -o /dev/null -w '%{http_code}' -H "x-vercel-protection-bypass: $WEB_BYPASS" "$WEB_URL/")
          api_status=$(curl -sS -o /dev/null -w '%{http_code}' -H "x-vercel-protection-bypass: $API_BYPASS" "$API_URL/health")
          echo "FDM736_AUTOMATION_BYPASS_WEB_STATUS=$web_status"
          echo "FDM736_AUTOMATION_BYPASS_API_STATUS=$api_status"
          test "$web_status" = 200
          test "$api_status" = 200
          python - <<'PY'
          import json, os, urllib.request
          req = urllib.request.Request(
              os.environ['HELPER_URL'],
              data=b'{"action":"issue"}',
              method='POST',
              headers={
                  'content-type': 'application/json',
                  'x-fdm736-web-bypass': os.environ['WEB_BYPASS'],
                  'x-fdm736-api-bypass': os.environ['API_BYPASS'],
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              payload = json.load(response)
          mapping = {
              'primary_email': 'AUREA_E2E_EMAIL',
              'primary_password': 'AUREA_E2E_PASSWORD',
              'primary_jwt': 'AUREA_E2E_PRIMARY_JWT',
              'second_jwt': 'AUREA_E2E_SECOND_JWT',
              'run_id': 'FDM736_RUN_ID',
          }
          for source, target in mapping.items():
              value = str(payload[source])
              print(f'::add-mask::{value}')
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
                  handle.write(f'{target}={value}\n')
          ids = ','.join(str(value) for value in payload['user_ids'])
          print(f'::add-mask::{ids}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              handle.write(f'FDM736_USER_IDS={ids}\n')
          PY
      - name: Install browser dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify API security boundary
        shell: bash
        run: |
          health=$(curl -sS -o /tmp/health.json -w '%{http_code}' -H "x-vercel-protection-bypass: $API_BYPASS" "$API_URL/health")
          ready=$(curl -sS -o /tmp/ready.json -w '%{http_code}' -H "x-vercel-protection-bypass: $API_BYPASS" "$API_URL/ready")
          unauth=$(curl -sS -o /tmp/me.json -w '%{http_code}' -H "x-vercel-protection-bypass: $API_BYPASS" "$API_URL/v1/me")
          echo "FDM736_API health=$health ready=$ready unauthenticated=$unauth"
          test "$health" = 200
          test "$ready" = 503
          test "$unauth" = 401
      - name: Run exact hosted browser ownership audit
        env:
          AUREA_E2E_URL: ${{ env.WEB_URL }}
          AUREA_E2E_API_URL: ${{ env.API_URL }}
          AUREA_VERCEL_WEB_PROTECTION_BYPASS: ${{ env.WEB_BYPASS }}
          AUREA_VERCEL_API_PROTECTION_BYPASS: ${{ env.API_BYPASS }}
          CI: 'true'
        run: |
          npx playwright test apps/web/e2e/specs/ownership.spec.ts --config=apps/web/e2e/playwright.config.ts --project=chromium --workers=1
      - name: Verify hosted astrology provenance
        shell: bash
        run: |
          code=$(curl -sS -o /tmp/natal.json -w '%{http_code}' \
            -X POST \
            -H "x-vercel-protection-bypass: $API_BYPASS" \
            -H "Authorization: Bearer $AUREA_E2E_PRIMARY_JWT" \
            -H 'content-type: application/json' \
            --data '{}' \
            "$API_URL/v1/astrology/natal")
          echo "FDM736_ASTROLOGY_NATAL_STATUS=$code"
          test "$code" = 200
          python - <<'PY'
          import json
          with open('/tmp/natal.json', encoding='utf-8') as handle:
              payload = json.load(handle)
          assert payload.get('engine_name')
          assert payload.get('ephemeris_version')
          print('FDM736_ASTROLOGY_PROVENANCE=present')
          PY
      - name: Cleanup disposable users
        if: always()
        shell: bash
        run: |
          if [ -z "${FDM736_USER_IDS:-}" ]; then exit 0; fi
          python - <<'PY'
          import json, os, urllib.request
          ids = [value for value in os.environ['FDM736_USER_IDS'].split(',') if value]
          body = json.dumps({'action': 'cleanup', 'user_ids': ids}).encode()
          req = urllib.request.Request(
              os.environ['HELPER_URL'], data=body, method='POST',
              headers={
                  'content-type': 'application/json',
                  'x-fdm736-web-bypass': os.environ['WEB_BYPASS'],
                  'x-fdm736-api-bypass': os.environ['API_BYPASS'],
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              payload = json.load(response)
          print(f"FDM736_CLEANED_USERS={payload.get('cleaned')}")
          if payload.get('cleaned') != len(ids):
              raise SystemExit('Disposable user cleanup incomplete')
          PY
