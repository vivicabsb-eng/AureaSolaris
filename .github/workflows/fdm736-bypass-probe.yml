name: FDM-736 Protected Preview Probe

on:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    if: github.head_ref == 'fdm-736/hosted-e2e-runner-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Mint ephemeral GitHub OIDC token
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);
      - name: Probe exact protected previews with OIDC only
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          WEB_URL: https://aurea-solaris-f0whqpl0m-fernando-damasos-projects.vercel.app/
          API_HEALTH_URL: https://aurea-solaris-4lxgl66k1-fernando-damasos-projects.vercel.app/health
        shell: bash
        run: |
          web_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -H "x-vercel-trusted-oidc-idp-token: $OIDC_TOKEN" "$WEB_URL")
          api_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -H "x-vercel-trusted-oidc-idp-token: $OIDC_TOKEN" "$API_HEALTH_URL")
          echo "FDM736_TRUSTED_OIDC_WEB_STATUS=$web_status"
          echo "FDM736_TRUSTED_OIDC_API_STATUS=$api_status"
          if [ "$web_status" != 200 ] || [ "$api_status" != 200 ]; then
            echo "::error::Vercel Trusted Sources is not accepting this GitHub Actions OIDC identity for both exact previews."
            exit 1
          fi
