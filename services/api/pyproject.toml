[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aurea-solaris-api"
version = "0.1.0"
description = "Private FastAPI service for Aurea Solaris Web V1"
requires-python = ">=3.12,<3.13"
dependencies = [
  "asyncpg==0.31.0",
  "fastapi==0.115.12",
  "pydantic==2.11.3",
  "PyJWT[crypto]==2.13.0",
  "pyswisseph==2.10.3.2",
  "tzdata==2026.3",
]

[project.optional-dependencies]
dev = [
  "asyncpg-stubs==0.31.3",
  "httpx==0.28.1",
  "mypy==1.15.0",
  "pytest==8.3.5",
  "ruff==0.11.10",
]

[tool.setuptools]
py-modules = ["engine_governance"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# These files are certified artifacts moved byte-for-byte from the legacy engine.
# Formatting or modernization belongs to a separately certified change.
"src/aurea_api/domain/astrology/engine.py" = ["E501", "I001", "UP006", "UP007", "UP015", "UP017", "UP035"]
"src/aurea_api/domain/astrology/governance.py" = ["E501", "F401", "I001", "UP006", "UP007", "UP035", "UP037"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
plugins = ["pydantic.mypy"]
